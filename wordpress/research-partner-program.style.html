<style id="opp-styles">
/* OligoPoly Research Partner Program — page-scoped styles (opp- prefix).
   This stylesheet ships inside this page's content only; it does not load sitewide. */
:root{
  --opp-bg:#030712;
  --opp-bg-alt:#0b1220;
  --opp-panel:#0f172a;
  --opp-line:rgba(148,163,184,.18);
  --opp-text:#e2e8f0;
  --opp-body:#cbd5e1;
  --opp-muted:#94a3b8;
  --opp-violet:#c24fef;
  /* Darker violet reserved for surfaces carrying white text: keeps white ≥4.5:1 (WCAG AA). */
  --opp-violet-btn:#ae3ada;
  --opp-violet-soft:#d8b4fe;
  --opp-violet-deep:#6f42c1;
  --opp-silver:#e5e7eb;
}
html:has(.opp-page-start){overflow-x:clip;background:var(--opp-bg);}
/* Neutralize default page-template chrome on this page only (this CSS ships inside this page's content) */
body:has(.opp-page-start) .site-main{padding:0;margin:0;max-width:none;width:100%;}
body:has(.opp-page-start) .entry-title,body:has(.opp-page-start) .page-header{display:none;}
body:has(.opp-page-start) .entry-content{margin:0;}
.opp{position:relative;left:50%;width:100vw;margin-left:-50vw;box-sizing:border-box;
  background:var(--opp-bg);color:var(--opp-body);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:1.0625rem;line-height:1.65;}
.opp *,.opp *::before,.opp *::after{box-sizing:inherit;}
.opp-inner{max-width:1160px;margin:0 auto;padding:4.5rem 1.5rem;}
.opp h1,.opp h2,.opp h3{color:var(--opp-text);line-height:1.15;margin:0 0 1rem;font-weight:800;letter-spacing:-.01em;}
.opp h2{font-size:clamp(1.65rem,3.2vw,2.25rem);}
.opp h3{font-size:1.15rem;font-weight:700;}
.opp p{margin:0 0 1rem;}
.opp a{color:var(--opp-violet-soft);text-decoration:underline;text-underline-offset:2px;}
.opp a:hover{color:#fff;}
.opp :is(a,button,input,select,textarea,summary):focus-visible{
  outline:2px solid var(--opp-violet);outline-offset:3px;border-radius:4px;}
.opp-eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--opp-violet-soft);margin-bottom:1.1rem;}
.opp-kicker{color:var(--opp-muted);max-width:46rem;margin:0 auto 2.5rem;text-align:center;}
.opp-btn{display:inline-block;padding:.9rem 1.9rem;border-radius:10px;font-weight:700;font-size:1rem;
  text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;}
.opp-btn-primary{background:linear-gradient(135deg,#8b2fc9 0%,var(--opp-violet-btn) 100%);color:#fff;
  box-shadow:0 4px 24px rgba(194,79,239,.35);}
.opp-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(194,79,239,.5);color:#fff;}
.opp-btn-secondary{background:transparent;color:var(--opp-silver);border-color:rgba(229,231,235,.35);}
.opp-btn-secondary:hover{border-color:var(--opp-violet-soft);color:#fff;}
.opp .opp-btn{text-decoration:none;}

/* Hero */
.opp-hero{background:
  radial-gradient(1100px 520px at 78% 18%,rgba(111,66,193,.32),transparent 62%),
  radial-gradient(700px 420px at 12% 82%,rgba(194,79,239,.14),transparent 60%),
  linear-gradient(180deg,#050816 0%,var(--opp-bg) 100%);
  border-bottom:1px solid var(--opp-line);}
.opp-hero .opp-inner{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);
  gap:3rem;align-items:center;padding-top:5.5rem;padding-bottom:5.5rem;}
.opp-hero h1{font-size:clamp(2.3rem,5.4vw,3.6rem);margin-bottom:1.25rem;
  background:linear-gradient(180deg,#ffffff 0%,#c7ced9 55%,#8f9aab 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.opp-hero-copy{max-width:36rem;font-size:1.125rem;}
.opp-hero-ctas{display:flex;flex-wrap:wrap;gap:.9rem;margin:1.9rem 0 1.2rem;}
.opp-hero-note{font-size:.9rem;color:var(--opp-muted);}
.opp-hero-note strong{color:var(--opp-body);font-weight:600;}
.opp-hero-emblem{text-align:center;}
.opp-hero-emblem img{max-width:min(100%,340px);height:auto;filter:drop-shadow(0 0 46px rgba(194,79,239,.35));}
.opp-badge{display:inline-flex;align-items:center;gap:.45rem;margin-top:1.1rem;padding:.4rem .95rem;
  border:1px solid var(--opp-line);border-radius:999px;font-size:.78rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--opp-muted);background:rgba(15,23,42,.6);}
.opp-badge::before{content:"";width:.55rem;height:.55rem;border-radius:50%;
  background:var(--opp-violet);box-shadow:0 0 10px var(--opp-violet);}

/* Cards / grids */
.opp-grid{display:grid;gap:1.25rem;margin:0;padding:0;list-style:none;}
.opp-grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.opp-grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.opp-card{background:linear-gradient(180deg,rgba(30,41,59,.55),rgba(15,23,42,.85));
  border:1px solid var(--opp-line);border-radius:14px;padding:1.5rem;}
.opp-card h3{margin-bottom:.4rem;}
.opp-card p{margin:0;color:var(--opp-muted);font-size:.95rem;}
.opp-stat{text-align:left;}
.opp-stat-value{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--opp-violet-soft),var(--opp-violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.3rem;}
.opp-section-alt{background:var(--opp-bg-alt);border-top:1px solid var(--opp-line);border-bottom:1px solid var(--opp-line);}
.opp-center{text-align:center;}

/* How it works */
.opp-steps{counter-reset:oppstep;}
.opp-step{position:relative;padding-top:3.4rem;}
.opp-step::before{counter-increment:oppstep;content:counter(oppstep,decimal-leading-zero);
  position:absolute;top:1.1rem;left:1.5rem;font-size:1rem;font-weight:800;color:var(--opp-violet-soft);
  border:1px solid rgba(216,180,254,.4);border-radius:8px;padding:.15rem .55rem;background:rgba(111,66,193,.15);}

/* Eligibility */
.opp-elig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;}
.opp-panel{border-radius:14px;padding:1.75rem;border:1px solid var(--opp-line);background:var(--opp-panel);}
.opp-panel-yes{border-color:rgba(216,180,254,.45);background:linear-gradient(180deg,rgba(111,66,193,.16),rgba(15,23,42,.9));}
.opp-panel-no{border-color:rgba(148,163,184,.28);}
.opp-panel ul{margin:0;padding-left:1.2rem;}
.opp-panel li{margin-bottom:.55rem;}
.opp-panel-no li{color:var(--opp-muted);}
.opp-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:.3rem .7rem;border-radius:999px;margin-bottom:1rem;}
.opp-tag-yes{color:#efe3ff;background:rgba(194,79,239,.22);border:1px solid rgba(216,180,254,.45);}
.opp-tag-no{color:var(--opp-muted);background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.3);}

/* Compliance */
.opp-compliance{border:1px solid rgba(216,180,254,.4);border-radius:16px;padding:2rem;
  background:linear-gradient(180deg,rgba(111,66,193,.14),rgba(3,7,18,.6));}
.opp-compliance ul{margin:0;padding:0;list-style:none;display:grid;gap:.9rem;}
.opp-compliance li{padding-left:1.9rem;position:relative;color:var(--opp-body);}
.opp-compliance li::before{content:"";position:absolute;left:0;top:.42em;width:.95rem;height:.95rem;
  border-radius:4px;background:linear-gradient(135deg,var(--opp-violet-soft),var(--opp-violet-deep));}
.opp-ruo-strip{margin-top:1.5rem;padding:1rem 1.25rem;border-radius:10px;font-weight:600;color:#fff;
  background:rgba(194,79,239,.16);border:1px solid rgba(216,180,254,.5);}

/* FAQ */
.opp-faq{max-width:820px;margin:0 auto;}
.opp-faq details{border:1px solid var(--opp-line);border-radius:12px;background:var(--opp-panel);
  margin-bottom:.8rem;overflow:hidden;}
.opp-faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
  gap:1rem;padding:1.1rem 1.35rem;font-weight:700;color:var(--opp-text);}
.opp-faq summary::-webkit-details-marker{display:none;}
.opp-faq summary::after{content:"+";font-size:1.35rem;font-weight:600;color:var(--opp-violet-soft);
  flex-shrink:0;transition:transform .2s ease;}
.opp-faq details[open] summary::after{transform:rotate(45deg);}
.opp-faq details > div{padding:0 1.35rem 1.2rem;color:var(--opp-muted);}
.opp-faq details > div p{margin:0 0 .6rem;}

/* Final CTA */
.opp-final{background:
  radial-gradient(760px 380px at 50% 0%,rgba(111,66,193,.35),transparent 65%),var(--opp-bg);
  border-top:1px solid var(--opp-line);}
.opp-final .opp-inner{text-align:center;padding-top:5rem;padding-bottom:5rem;}
.opp-final h2{font-size:clamp(1.9rem,4vw,2.6rem);}
.opp-final p{max-width:40rem;margin:0 auto 1.8rem;color:var(--opp-muted);}

/* Application form (Jetpack form on this page only) */
.opp-apply .opp-inner{max-width:880px;}
.opp-apply-intro{margin-bottom:2rem;}
.opp-apply-note{border:1px solid var(--opp-line);border-left:3px solid var(--opp-violet);
  border-radius:10px;padding:1rem 1.25rem;background:var(--opp-panel);font-size:.95rem;color:var(--opp-muted);}
.opp-form-zone{background:var(--opp-bg);}
/* Jetpack may or may not wrap the form in a container div; pad whichever is outermost, never both. */
.opp-form-zone .wp-block-jetpack-contact-form-container,
.opp-form-zone > .wp-block-jetpack-contact-form{max-width:880px;margin:0 auto;padding:0 1.5rem;
  color:var(--opp-body);font-family:Inter,system-ui,sans-serif;}
.opp-form-zone .wp-block-jetpack-contact-form-container .wp-block-jetpack-contact-form{
  max-width:none;margin:0;padding:0;}
.wp-block-jetpack-contact-form .jetpack-field__label,
.wp-block-jetpack-contact-form label{color:var(--opp-text);font-weight:600;font-size:.95rem;}
.wp-block-jetpack-contact-form input[type="text"],
.wp-block-jetpack-contact-form input[type="email"],
.wp-block-jetpack-contact-form input[type="tel"],
.wp-block-jetpack-contact-form input[type="url"],
.wp-block-jetpack-contact-form textarea,
.wp-block-jetpack-contact-form select{
  width:100%;background:#0b1220;border:1px solid rgba(148,163,184,.35);border-radius:10px;
  color:var(--opp-text);padding:.8rem 1rem;font-size:1rem;font-family:inherit;}
.wp-block-jetpack-contact-form input::placeholder,
.wp-block-jetpack-contact-form textarea::placeholder{color:#78889e;}
.wp-block-jetpack-contact-form input:focus,
.wp-block-jetpack-contact-form textarea:focus,
.wp-block-jetpack-contact-form select:focus{border-color:var(--opp-violet);
  box-shadow:0 0 0 3px rgba(194,79,239,.25);outline:none;}
.wp-block-jetpack-contact-form input[type="checkbox"]{accent-color:var(--opp-violet);width:1.1rem;height:1.1rem;}
.wp-block-jetpack-contact-form .wp-block-jetpack-button button,
.wp-block-jetpack-contact-form button[type="submit"]{
  background:linear-gradient(135deg,#8b2fc9,var(--opp-violet-btn));color:#fff;font-weight:700;font-size:1.05rem;
  border:none;border-radius:10px;padding:1rem 2.4rem;cursor:pointer;
  box-shadow:0 4px 24px rgba(194,79,239,.35);transition:transform .15s ease,box-shadow .15s ease;}
.wp-block-jetpack-contact-form .wp-block-jetpack-button button:hover{transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(194,79,239,.5);}
.contact-form-submission{border:1px solid rgba(216,180,254,.5);border-radius:12px;padding:1.5rem;
  background:rgba(111,66,193,.14);color:var(--opp-text);}

/* Responsive */
@media (max-width:980px){
  .opp-hero .opp-inner{grid-template-columns:1fr;text-align:left;}
  .opp-hero-emblem{order:-1;text-align:left;}
  .opp-hero-emblem img{max-width:200px;}
  .opp-grid-3,.opp-grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .opp-elig{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .opp-inner{padding:3rem 1.1rem;}
  .opp-grid-3,.opp-grid-4{grid-template-columns:1fr;}
  .opp-hero .opp-inner{padding-top:3.5rem;padding-bottom:3.5rem;}
  .opp-hero-ctas .opp-btn{width:100%;text-align:center;}
}
/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  .opp *,.opp *::before,.opp *::after{transition:none !important;animation:none !important;}
  .opp-btn-primary:hover,.wp-block-jetpack-contact-form .wp-block-jetpack-button button:hover{transform:none;}
}
</style>
<span class="opp-page-start" aria-hidden="true"></span>
<!-- /wp:html -->
